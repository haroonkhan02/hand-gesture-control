[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-gesture-control"
version = "1.0.0"
description = "Touchless mouse, slide and whiteboard control with real-time hand tracking and a custom-trained gesture classifier."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Haroon Khan" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe==0.10.21",  # 1.0.x crashes on recent macOS (Metal graph service)
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gesture-control = "gesture_control.app:main"
gesture-collect = "gesture_control.collect:main"
gesture-train = "gesture_control.train:main"
gesture-benchmark = "gesture_control.benchmark:main"
gesture-download-model = "gesture_control.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
